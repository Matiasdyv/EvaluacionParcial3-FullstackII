# Perfil de producción (EC2). No contiene secretos: se leen de variables de entorno.
# Uso:  SPRING_PROFILES_ACTIVE=prod  y las variables DB_HOST, DB_NAME, DB_USER, DB_PASSWORD, JWT_SECRET
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:saludtotal}?serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
jwt.secret=${JWT_SECRET}
